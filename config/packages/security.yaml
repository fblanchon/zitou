# Security of the engine. A site receives a copy of this file through `make sync-security` and never edits it:
# the protected routes change with the engine's versions.
security:
    password_hashers:
        Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface: 'auto'

    providers:
        zitou_admin_accounts:
            id: Zitou\Core\Security\AdminUserProvider
        zitou_public_accounts:
            id: Zitou\Core\Security\PublicUserProvider

    # A developer is also an administrator, who is also a user (fiche 11).
    role_hierarchy:
        ROLE_ADMIN: ROLE_USER
        ROLE_DEV: ROLE_ADMIN

    firewalls:
        dev:
            pattern: ^/(_profiler|_wdt|assets|build)/
            security: false

        # The admin (/suite), the developer space (/dev) and the stored files share one session (fiche 12).
        admin:
            pattern: ^/(suite|dev|uploads)(/|$)
            lazy: true
            provider: zitou_admin_accounts
            user_checker: Zitou\Core\Security\UserChecker
            entry_point: Zitou\Core\Security\AdminEntryPoint
            form_login:
                login_path: zitou_platform_auth_login
                check_path: zitou_platform_auth_login
                username_parameter: email
                password_parameter: password
                enable_csrf: true
                default_target_path: zitou_general_dashboard
            login_throttling:
                max_attempts: 5
                interval: '15 minutes'
            remember_me:
                secret: '%kernel.secret%'
                name: ZITOU_ADMIN_REMEMBER_ME
                lifetime: 604800
                path: /
                samesite: lax
            logout:
                path: zitou_platform_auth_logout
                target: zitou_platform_auth_login
                enable_csrf: true
                csrf_token_id: logout
                # The public site signs in through the same browser session: leaving one never leaves the other.
                invalidate_session: false

        # The public site has its own sign-in (fiche 42): its accounts only, its own remember-me cookie. The accounts
        # stay off, and the sign-in answers nothing, until a developer turns them on.
        public:
            lazy: true
            provider: zitou_public_accounts
            user_checker: Zitou\Core\Security\UserChecker
            custom_authenticators:
                - Zitou\Module\Platform\Account\Security\PublicLoginAuthenticator
            login_throttling:
                max_attempts: 5
                interval: '15 minutes'
            remember_me:
                secret: '%kernel.secret%'
                name: ZITOU_REMEMBER_ME
                lifetime: 2592000
                path: /
                samesite: lax
            logout:
                path: zitou_platform_account_logout
                target: zitou_home
                enable_csrf: true
                csrf_token_id: logout
                invalidate_session: false

    # Only the first matching rule applies.
    access_control:
        - { path: ^/suite/platform/(login|logout|password|invitation|access-request|register)(/|$), roles: PUBLIC_ACCESS }
        - { path: ^/uploads/, roles: PUBLIC_ACCESS }
        - { path: ^/dev(/|$), roles: ROLE_DEV }
        - { path: ^/suite(/|$), roles: ROLE_USER }

when@test:
    security:
        password_hashers:
            # Hashing is slow on purpose; tests use the lowest costs.
            Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface:
                algorithm: auto
                cost: 4
                time_cost: 3
                memory_cost: 10
