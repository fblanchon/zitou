# Security rules of this site only, beside the engine's copy (config/packages/security.yaml), which
# "make sync-security" replaces at every update of the engine and which is never edited (fiche 34).
#
# Symfony merges this file into the engine's security, key by key. What fits here: extra roles in the
# role_hierarchy, a password hasher for a class of the site, a setting of an existing firewall.
# What does not: a new firewall or a second access_control list (Symfony refuses both outside the first
# file). The pages of the site's modules are protected like the engine's, by the module's permissions and
# route guards, or by #[IsGranted] on the controller.
#
# Example:
# security:
#     role_hierarchy:
#         ROLE_EDITOR: ROLE_USER
security: ~
